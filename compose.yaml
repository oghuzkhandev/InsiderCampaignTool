services:
  api:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./backend:/app
    environment:
      PORT: "8081"
      LLM_PROVIDER: "${LLM_PROVIDER:-mock}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"

  web:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:8080:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules: