# İzole uçtan uca (e2e) test ortamı. Yerelde ve CI'da aynı tanım kullanılır:
#
#   make e2e        # ortamı kurar, Playwright testlerini koşturur, ortamı siler
#   make e2e-up     # yalnızca ortamı kurar (testleri elle koşturmak için)
#   make e2e-down   # ortamı ve verisini siler
#
# Geliştirme ortamından (docker compose up) tamamen ayrıdır:
#   * ayrı Compose projesi (`name`): ayrı container, ağ ve volume'lar
#   * postgres host'a açılmaz ve veriyi diske yazmaz (tmpfs); geliştirme
#     veritabanına ve 5432 portuna dokunulmaz
#   * api host'a açılmaz; testler yalnızca web (aynı origin /api proxy'si) üzerinden
#     bir kullanıcı gibi konuşur
#   * veri: küçük ve kontrollü e2e veri kümesi (SEED_DATASET=e2e)
#
# Kullanım: docker compose -f compose.yaml -f compose.e2e.yaml ...
name: campaign-e2e

services:
  postgres:
    ports: !reset []
    volumes: !override
      - type: tmpfs
        target: /var/lib/postgresql/data

  seed:
    environment:
      SEED_DATASET: e2e

  api:
    ports: !reset []
    environment:
      LLM_PROVIDER: mock

  # Gönderim servisleri yalnızca `delivery` profiliyle açılır. Mevcut Playwright
  # testleri onaydan sonra kampanyanın `approved` kaldığını doğrular; worker
  # çalışsaydı durum `sending`/`completed` olurdu. Gönderim ve dashboard
  # testleri bu profili bilerek açar (--profile delivery).
  #
  # Gönderim testi deterministiktir: rastgele 429/500 yok, gecikme yok. Provider
  # `accept_then_drop` modundadır: her mesajın ilk kabul yanıtı düşer, worker aynı
  # Idempotency-Key ile yeniden dener ve provider kayıtlı kabulü döndürür. Böylece
  # test, tek başarılı yolun yanında yanıt kaybı + idempotency zincirini de gerçek
  # worker, provider ve veritabanıyla geçer; sonuç yine de her seferinde aynıdır
  # (7 mesaj gönderildi, hiçbiri başarısız).
  mock-provider:
    profiles: ["delivery"]
    ports: !reset []
    environment:
      MOCK_PROVIDER_LATENCY: "0s"
      MOCK_PROVIDER_429_RATE: "0"
      MOCK_PROVIDER_500_RATE: "0"
      MOCK_PROVIDER_MODE: accept_then_drop

  # Yeniden deneme beklemesi kısaltılır; testin süresi saniyeler içinde kalır.
  worker:
    profiles: ["delivery"]
    environment:
      WORKER_BACKOFF_BASE: "100ms"
      WORKER_BACKOFF_CAP: "500ms"

  # İsteğe bağlı metrik sunucusu: `observability` profiliyle açılır. Geliştirme
  # portundan (9091) farklı bir loopback portunda yayımlanır ve veriyi diske yazmaz.
  prometheus:
    ports: !override
      - "127.0.0.1:19091:9090"
    volumes: !override
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Prometheus `nobody` olarak çalışır; tmpfs varsayılanı root sahiplidir, bu yüzden
    # herkese yazılabilir (sekizlik mod seçenek metniyle verilir).
    tmpfs:
      - /prometheus:mode=1777

  web:
    # Yalnızca loopback'te ve geliştirme portlarından (8080/8081/5173) farklı.
    ports: !override
      - "127.0.0.1:18080:80"
