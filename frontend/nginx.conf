# Vue uygulamasını servis eder ve /api isteklerini aynı origin üzerinden API'ye
# proxy'ler (ADR-014): CORS ayarı gerekmez.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # İçerik üretimi ve onay gövdeleri küçüktür (API de 64 KiB ile sınırlar).
    client_max_body_size 1m;

    # Docker'ın yerleşik DNS'i. API konteyneri yeniden oluşturulunca (yeni IP) nginx
    # adı yeniden çözer; ad başlangıçta çözülseydi API henüz yokken nginx başlamazdı.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Tek sayfa uygulaması: bilinmeyen yollar (örn. /campaigns/<id>/delivery) index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Giriş dosyası her zaman yeniden doğrulanır (yeni sürüm hemen görünür).
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Vite çıktıları içerik karması taşır: kalıcı önbellek güvenlidir.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API proxy'si. Buffering KAPALI: içerik üretimi (`delta`) ve dashboard
    # (`snapshot`) SSE akışları bekletilmeden tarayıcıya ulaşmalıdır; nginx
    # biriktirirse canlı olmaz.
    location /api/ {
        set $api_upstream http://api:8081;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        # İki okuma arasındaki azami boşluk: LLM çağrısı 60 sn'ye kadar sürebilir ve
        # düzeltme denemesiyle iki çağrı olabilir; dashboard saniyede bir olay yollar.
        proxy_read_timeout 130s;

        # API kapalıyken arayüzün çözebileceği JSON hata (nginx'in HTML sayfası değil).
        error_page 502 503 504 @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 502 '{"error":{"code":"API_UNAVAILABLE","message":"Sunucuya ulaşılamıyor. Biraz sonra yeniden deneyin."}}';
    }
}
