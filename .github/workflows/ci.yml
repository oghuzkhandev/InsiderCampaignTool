name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Bağımlılıkları doğrula
        run: |
          go mod verify
          go mod tidy -diff

      - name: Format (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt gerektiren dosyalar:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (make test)
        working-directory: .
        run: make test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # package-lock.json ile package.json uyuşmazsa hata verir.
      - name: Bağımlılıkları kur (npm ci)
        run: npm ci

      # package.json'daki `lint` script'i --fix kullandığı için CI'da
      # doğrudan araçlar çalıştırılır.
      - name: Lint (oxlint)
        run: npx --no-install oxlint .

      - name: Lint (eslint)
        run: npx --no-install eslint .

      - name: Birim testleri
        run: npm run test:unit -- --run

      # `build` önce type-check, sonra vite build çalıştırır.
      - name: Build
        run: npm run build

  compose:
    name: Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Çıkış kodu 0 ise yapılandırma geçerlidir. Aksi halde adım başarısız olur.
      - name: Compose yapılandırmasını doğrula
        run: docker compose config --quiet

      - name: E2E Compose yapılandırmasını doğrula
        run: docker compose -f compose.yaml -f compose.e2e.yaml config --quiet

      # İsteğe bağlı Prometheus profili de geçerli olmalı.
      - name: Observability profili yapılandırmasını doğrula
        run: |
          docker compose --profile observability config --quiet
          docker compose -f compose.yaml -f compose.e2e.yaml --profile delivery --profile observability config --quiet

  # Uçtan uca (Playwright) testler, geliştirme ortamından ayrı izole Compose
  # projesinde koşar (compose.e2e.yaml): ayrı veritabanı, kontrollü veri,
  # yalnızca web üzerinden (bir kullanıcı gibi). Yerelde aynı ortam: `make e2e`.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları kur (npm ci)
        working-directory: frontend
        run: npm ci

      - name: Tip kontrolü (e2e)
        working-directory: frontend
        run: npm run type-check:e2e

      # Yalnızca Chromium: testler tek tarayıcıda koşar.
      - name: Playwright Chromium kur
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # 1. döngü: worker ve provider olmadan (onaylanan kampanya `approved` kalır).
      # Gerçek gönderim testleri (@real) burada koşmaz.
      - name: İzole e2e ortamını kur
        run: make e2e-up

      - name: E2E testleri
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
        run: npx playwright test --grep-invert @real

      - name: Ortamı sil (1. döngü)
        run: make e2e-down

      # 2. döngü: `delivery` profili açık, yani gerçek worker + mock provider +
      # SSE. Yalnızca @real testleri koşar (gönderimin tamamlandığını gösterir).
      - name: Gönderim e2e ortamını kur (worker, mock provider)
        run: make e2e-delivery-up

      # /metrics yalnızca Docker iç ağından erişilir, host'a yayımlanmaz (ADR-016).
      - name: Metrics iç ağdan erişilir, host'a yayımlanmaz
        run: make e2e-metrics-internal

      - name: E2E testleri (gerçek gönderim, @real)
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
        run: npx playwright test --grep @real

      - name: Ortamı sil (2. döngü)
        run: make e2e-down

      # 3. döngü: isteğe bağlı Prometheus (`observability` profili). `promtool`
      # (Prometheus imajıyla gelir) metrik çıktısını ve yapılandırmayı denetler; gerçek
      # scrape'te api ve worker `up`, saklama sınırlı, arayüz yalnızca 127.0.0.1'de.
      - name: Observability (Prometheus scrape ve promtool)
        run: make e2e-observability

      - name: Servis logları
        if: failure()
        run: make e2e-logs

      - name: Playwright raporu ve izleri
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Ortamı sil
        if: always()
        run: make e2e-down
