# Prometheus yapılandırması (ADR-016, ADR-027, ADR-028). Yalnızca `observability`
# Compose profiliyle çalışır: docker compose --profile observability up
#
# API ve worker `/metrics` uçlarını Docker iç ağından okur; bu uçlar host'a
# yayımlanmaz. Mock provider metrik sunmaz.
global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 30s

scrape_configs:
  # `up` serisi her hedef için kendiliğinden üretilir: 1 erişilebilir, 0 değil.
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:9090"]

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9090"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
